name: Validacion Sintaxis SQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar SQL Linter (SQLFluff)
        run: pip install sqlfluff

      - name: Validar sintaxis de los scripts SQL
        # Dialecto base: ANSI SQL (estándar)
        run: sqlfluff parse . --dialect ansi
